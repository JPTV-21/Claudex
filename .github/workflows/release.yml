name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.1.0)'
        required: true
        default: v1.5.0

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
            asset: ClaudeX-windows-x64.zip
            package: windows
          - name: windows-arm64
            os: windows-11-arm
            arch: ARM64
            asset: ClaudeX-windows-arm64.zip
            package: windows
          - name: macos-x64
            os: macos-15-intel
            arch: x86_64
            asset: ClaudeX-macos-x64.tar.gz
            package: unix
          - name: macos-arm64
            os: macos-15
            arch: arm64
            asset: ClaudeX-macos-arm64.tar.gz
            package: unix
          - name: linux-x64
            os: ubuntu-22.04
            arch: x86_64
            asset: ClaudeX-linux-x64.tar.gz
            package: unix
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            asset: ClaudeX-linux-arm64.tar.gz
            package: unix

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -A ${{ matrix.arch }}
          -DCMAKE_BUILD_TYPE=Release -DCLAUDEX_BUILD_TESTS=OFF

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release -DCLAUDEX_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        run: file build/ClaudeX

      - name: Package (Windows)
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/ClaudeX.exe out/
          Copy-Item README.md, LICENSE out/
          Compress-Archive -Path out/* -DestinationPath ${{ matrix.asset }}

      - name: Package (Unix)
        if: matrix.package == 'unix'
        shell: bash
        run: |
          mkdir -p out
          cp build/ClaudeX out/
          cp README.md LICENSE out/
          chmod +x out/ClaudeX
          tar -czf ${{ matrix.asset }} -C out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ClaudeX-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: List assets
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ClaudeX ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
